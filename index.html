<style>
/* Layout: una hoja de taco de calendario (portada) que se arranca y deja ver la dosis del día en una sola columna de fichas. */
:root {
  --bg: #E6E8E4;
  --paper: #FCFCF9;
  --paper-2: #F2F3EF;
  --ink: #1A1C21;
  --muted: #5C6169;
  --line: #D3D6D0;
  --red: #C8102E;
  --red-soft: #F7E3E5;
  --binding: #23252B;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 30px -12px rgba(20,22,28,.28);
  --f-display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101114; --paper: #1B1C20; --paper-2: #23252A; --ink: #ECEBE6; --muted: #9A9EA6;
    --line: #30333A; --red: #FF5266; --red-soft: #3A1C21; --binding: #07080A;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101114; --paper: #1B1C20; --paper-2: #23252A; --ink: #ECEBE6; --muted: #9A9EA6;
  --line: #30333A; --red: #FF5266; --red-soft: #3A1C21; --binding: #07080A;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.7); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 28px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }

/* ---------- Portada: hoja de taco ---------- */
.taco { position: relative; padding-bottom: 10px; }
.taco::before, .taco::after {
  content: ""; position: absolute; left: 10px; right: 10px; height: 100%; bottom: 4px; z-index: 0;
  background: var(--paper-2); border-radius: 2px 2px 6px 6px; box-shadow: var(--shadow);
}
.taco::after { left: 18px; right: 18px; bottom: 0; opacity: .7; }
.sheet {
  position: relative; z-index: 1; background: var(--paper); border-radius: 2px 2px 6px 6px;
  box-shadow: var(--shadow); overflow: hidden; transform-origin: 50% 0;
  transition: transform .75s cubic-bezier(.5,-0.2,.6,1), opacity .75s ease;
}
.sheet.torn { transform: translateY(-115%) rotate(-9deg); opacity: 0; }
.binding { height: 30px; background: var(--binding); display: flex; justify-content: center; gap: 120px; align-items: center; }
.binding span { width: 12px; height: 12px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 2px 2px rgba(0,0,0,.35); }
.perf { height: 8px; background: radial-gradient(circle at 5px 0, var(--binding) 2.2px, transparent 2.6px) 0 0 / 10px 8px repeat-x; opacity: .35; }
.sheet-in { padding: 14px 22px 22px; display: grid; gap: 6px; text-align: center; }
.sheet-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.month { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; color: var(--red); line-height: 1; }
.daynum {
  font-family: var(--f-display); font-weight: 900; line-height: .82; font-size: clamp(150px, 48vw, 220px);
  letter-spacing: -.02em; color: var(--ink); margin-top: 10px; font-variant-numeric: lining-nums;
}
.daynum.festivo { color: var(--red); }
.weekday { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: .14em; line-height: 1; }
.almanac { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0; margin-top: 10px; color: var(--muted); }
.almanac div { display: grid; gap: 2px; text-align: left; }
.almanac div:last-child { text-align: right; }
.almanac b { font-family: var(--f-body); font-weight: 600; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.santo { display: grid; gap: 2px; justify-items: center; margin-top: 8px; }
.santo .mono { color: var(--red); font-size: 10px; }
.santo span:last-child { font-style: italic; font-size: 15px; line-height: 1.3; text-wrap: balance; color: var(--ink); }
.cover-refran { font-style: italic; font-size: 19px; line-height: 1.35; text-wrap: balance; margin: 12px 4px 2px; }
.cover-refran::before { content: "«"; color: var(--red); }
.cover-refran::after { content: "»"; color: var(--red); }
.cover-sub { color: var(--muted); }
.tear {
  margin-top: 14px; border: 0; background: var(--red); color: #fff; border-radius: 999px; padding: 13px 18px;
  font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  display: inline-flex; gap: 10px; align-items: center; justify-content: center;
}
.tear svg { width: 16px; height: 16px; }
.daynav { display: flex; justify-content: space-between; align-items: center; }
.daynav button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; }
.daynav button[disabled] { opacity: .35; cursor: default; }

/* Cabecera compacta tras arrancar */
.mast { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 8px; padding: 12px 16px; box-shadow: var(--shadow); animation: drop .5s ease both; }
.mast .n { font-family: var(--f-display); font-weight: 900; font-size: 54px; line-height: .85; }
.mast .n.festivo { color: var(--red); }
.mast .t { display: grid; gap: 2px; flex: 1; min-width: 0; }
.mast .w { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .1em; line-height: 1; }
.mast button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Progreso y racha */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--paper); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.stat .v { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 18px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .4s ease; }

/* ---------- Fichas ---------- */
.group { display: grid; gap: 12px; }
.group h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .06em; line-height: 1; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.group h2 span { color: var(--muted); }
.card { background: var(--paper); border-radius: 8px; padding: 16px 16px 14px; display: grid; gap: 10px; min-width: 0; border: 1px solid transparent; transition: border-color .2s, opacity .2s; }
.card.done { border-color: var(--line); background: var(--paper-2); }
.card-h { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.card-h .lab { flex: 1; min-width: 0; color: var(--red); }
.icon-btn { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--paper-2); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.on { color: var(--red); }
.icon-btn.spent { opacity: .35; }
.icon-btn.on svg path { fill: currentColor; }
.card h3 { margin: 0; font-family: var(--f-body); font-weight: 600; font-size: 21px; line-height: 1.25; text-wrap: balance; }
.card .meta { color: var(--muted); font-size: 14px; }
.card p { margin: 0; }
.card .big { font-size: 22px; line-height: 1.35; font-style: italic; text-wrap: balance; }
.card .en { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.card .why { font-size: 15px; color: var(--ink); }
.card .why b { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 6px; }
.word { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: .95; letter-spacing: .01em; }
.tag { justify-self: start; display: inline-block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; color: var(--muted); }
details { border-top: 1px dashed var(--line); padding-top: 8px; }
summary { cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
details p { margin-top: 8px !important; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 13px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.check[aria-pressed="true"] { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.btn svg { width: 14px; height: 14px; }

.connect { background: var(--ink); color: var(--paper); border-radius: 8px; padding: 18px; display: grid; gap: 10px; }
.connect h2 { color: var(--paper); }
.connect p { margin: 0; opacity: .85; }
.connect .btn { border-color: currentColor; color: var(--paper); }

/* ---------- Guardados ---------- */
.saved-list { display: grid; gap: 10px; }
.saved-item { background: var(--paper); border-radius: 8px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.saved-item .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.saved-item .t b { font-weight: 600; overflow-wrap: anywhere; }
.empty { background: var(--paper); border-radius: 8px; padding: 22px; color: var(--muted); text-align: center; }

/* ---------- Barra inferior ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
  display: flex; justify-content: center; gap: 6px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tabbar button { flex: 1; max-width: 170px; border: 0; background: transparent; border-radius: 10px; padding: 8px; display: grid; justify-items: center; gap: 2px; color: var(--muted); }
.tabbar button[aria-current="page"] { color: var(--red); background: var(--red-soft); }
.tabbar svg { width: 20px; height: 20px; }

/* ---------- Hoja de Claude ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,10,12,.45); z-index: 30; }
.sheet-ai {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 82%; overflow-y: auto; background: var(--paper);
  border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: up .3s ease both;
}
.sheet-ai .in { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
.sheet-ai h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; }
.ai-text { white-space: pre-wrap; font-size: 16.5px; line-height: 1.6; }
.ai-text.wait { color: var(--muted); font-style: italic; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 14px; }
.foot { color: var(--muted); text-align: center; font-size: 13px; }

/* ---------- Color por bloque ---------- */
:root {
  --c-ver: #2445C8; --c-pensar: #7A3FB0; --c-mundo: #2C7A47; --c-lengua: #A86B05; --c-cuerpo: #D24B28;
  --on-g: #FFFFFF; --sun-bg: #FFE27A; --sun-ink: #2A2306; --sun-line: #E9C445;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c-ver: #8299FF; --c-pensar: #C49BFF; --c-mundo: #6FCB8E; --c-lengua: #F2B544; --c-cuerpo: #FF8A6B;
    --on-g: #121317; --sun-bg: #3A3110; --sun-ink: #FFE9A3; --sun-line: #5C4D16;
  }
}
:root[data-theme="dark"] {
  --c-ver: #8299FF; --c-pensar: #C49BFF; --c-mundo: #6FCB8E; --c-lengua: #F2B544; --c-cuerpo: #FF8A6B;
  --on-g: #121317; --sun-bg: #3A3110; --sun-ink: #FFE9A3; --sun-line: #5C4D16;
}
.group { --g: var(--red); }
.group h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--g); flex: none; align-self: center; }
.group h2 { color: var(--ink); flex-wrap: wrap; }
.card-h .lab { color: var(--g, var(--red)); display: inline-flex; align-items: center; gap: 6px; }
.card-h .lab::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--g, var(--red)); }
.card .tag { border-color: color-mix(in srgb, var(--g, var(--muted)) 45%, transparent); color: var(--g, var(--muted)); }
.btn.primary { background: var(--g, var(--ink)); border-color: var(--g, var(--ink)); color: var(--on-g); }
.group .btn.check[aria-pressed="true"] { background: color-mix(in srgb, var(--g) 16%, transparent); border-color: var(--g); color: var(--g); }

/* Carrusel deslizable para "Ver, leer y escuchar" */
.rail {
  display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 12px; overflow-x: auto;
  scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 6px; scroll-padding-inline: 16px;
}
.rail::-webkit-scrollbar { display: none; }
.rail > .card { scroll-snap-align: start; }
.swipe { color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.poster-art {
  margin: -16px -16px 4px; height: 132px; border-radius: 8px 8px 0 0; background: var(--g); color: var(--on-g);
  display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 16px; position: relative; overflow: hidden;
}
.poster-art svg { width: 64px; height: 64px; opacity: .95; }
.poster-art .num { font-family: var(--f-display); font-weight: 900; font-size: 110px; line-height: .7; opacity: .18; position: absolute; right: -6px; top: 6px; }
.poster-art .kind { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.poster .card-h { margin-top: 2px; }

/* Tratamientos especiales */
.card.fill { background: var(--g); color: var(--on-g); }
.card.fill .card-h, .card.fill .card-h .lab, .card.fill .icon-btn, .card.fill .en { color: var(--on-g); }
.card.fill .card-h .lab::before { background: var(--on-g); }
.card.fill .btn { border-color: color-mix(in srgb, var(--on-g) 45%, transparent); color: var(--on-g); }
.card.fill .btn.primary { background: var(--on-g); color: var(--g); }
.card.fill .big { font-size: 26px; }
.card.inkcard { background: var(--ink); color: var(--paper); }
.card.inkcard .card-h, .card.inkcard .icon-btn, .card.inkcard .tag { color: color-mix(in srgb, var(--paper) 75%, transparent); border-color: color-mix(in srgb, var(--paper) 30%, transparent); }
.card.inkcard .btn { border-color: color-mix(in srgb, var(--paper) 35%, transparent); color: var(--paper); }
.card.inkcard .big { font-style: normal; font-family: var(--f-body); font-weight: 600; font-size: 22px; }
.card.quote .big { font-size: 25px; }
.card.quote .big::first-letter { color: var(--g); }
.wrap > *, .group > * { min-width: 0; }

/* Imagen del día */
.art { margin: 0; display: grid; gap: 10px; }
.art canvas { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; display: block; border-radius: 10px; box-shadow: var(--shadow); background: var(--paper-2); }
.art figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.art figcaption b { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .04em; line-height: 1; display: block; }
.art figcaption span { color: var(--muted); }

/* Buena noticia */
.news { background: var(--sun-bg); color: var(--sun-ink); border-radius: 10px; padding: 18px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.news::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; border: 18px solid var(--sun-line); opacity: .7; }
.news .mono { position: relative; z-index: 1; }
.news h3 { margin: 0; font-family: var(--f-body); font-weight: 600; font-size: 22px; line-height: 1.25; text-wrap: balance; position: relative; z-index: 1; }
.news p { margin: 0; position: relative; z-index: 1; }
.news .src { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; }
.news .btn { border-color: color-mix(in srgb, var(--sun-ink) 35%, transparent); color: var(--sun-ink); }

/* Instalar en el móvil */
.install { background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; }
.install ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.install .row { display: flex; justify-content: space-between; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap" id="app">
  <section id="view-hoy" class="wrap" style="gap:28px">
    <div id="cover"></div>
    <div class="stats" id="stats"></div>
    <div id="feed" class="wrap" style="gap:34px"></div>
  </section>
  <section id="view-guardados" class="wrap" hidden>
    <div class="group">
      <h2>Guardados <span class="mono" id="saved-count"></span></h2>
      <div class="saved-list" id="saved-list"></div>
    </div>
  </section>
  <p class="foot">Cada día, una hoja nueva. Vuelve mañana.<br><span class="mono" id="version"></span></p>
</div>

<nav class="tabbar" aria-label="Secciones">
  <button id="tab-hoy" aria-current="page" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
    <span class="mono">Hoy</span>
  </button>
  <button id="tab-guardados" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    <span class="mono">Guardados</span>
  </button>
</nav>

<script>
/* =================== CONTENIDO =================== */
const enc = encodeURIComponent;
const L = {
  yt: q => "https://www.youtube.com/results?search_query=" + enc(q),
  g: q => "https://www.google.com/search?q=" + enc(q),
  tt: q => "https://www.tiktok.com/search?q=" + enc(q),
  ig: h => "https://www.instagram.com/" + h + "/",

function h(tag, attrs = {}, ...kids) {

    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);

// Una ilustración generativa distinta cada día: misma fecha, misma imagen.
function rng(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    pals: [["#2B1B3D", "#5B2A57", "#B4436C", "#F08A5D", "#F9D77E"], ["#1D1A2F", "#3E2A4F", "#8C3B4A", "#D9693F", "#F2B35B"],

  { style: "Azulejo", names: ["Triana", "Real Alcázar", "Patio cordobés", "Alhambra", "Casa de Pilatos", "Plaza de España"],
    pals: [["#F6F3EA", "#1F4E9C", "#E3A72F", "#2E7D5B", "#B23A2E"], ["#F4EFE2", "#123C69", "#AC3B61", "#EDC7B7", "#2F6F73"], ["#FBF7EE", "#0F5257", "#E07A1F", "#F2C14E", "#3A2E39"]], draw: drawAzulejo },
  { style: "Olas", names: ["Tarifa", "Bolonia", "Mar de Alborán", "Caños de Meca", "Cabo de Gata", "Maro"],
    pals: [["#F4EEDF", "#0B2545", "#1F5F8B", "#7FB2D5", "#C8553D"], ["#F7F0E6", "#102542", "#1B6B80", "#9CD3D8", "#E07A5F"]], draw: drawOlas },
  { style: "Jardín", names: ["Generalife", "Patio de mayo", "La Concepción", "Jardines de Murillo", "Carmen granadino"],
    pals: [["#163B2F", "#2F6B4F", "#F3C6CF", "#E86A8E", "#FFD166"], ["#1E2A3A", "#3A6351", "#F2E8CF", "#E76F51", "#F4A261"]], draw: drawJardin },
  { style: "Cielo", names: ["Calar Alto", "Sierra de los Filabres", "Desierto de Tabernas", "Doñana de noche", "Roque de Sierra Morena"],
    pals: [["#05081A", "#0E1F44", "#24467F", "#8FB3E8", "#FFF4D6"], ["#0B0614", "#24123A", "#4B2C6E", "#B79CED", "#FFE9C7"]], draw: drawCielo },

function artFor(d) {
  const bump = (state.bumps[keyOf(d)] || {}).art || 0;
  const seed = dayNumOf(d) * 7919 + bump * 104729;
  const r = rng(seed);
  const def = ART[(dayNumOf(d) + bump) % ART.length];
  return { def, r, pal: def.pals[Math.floor(r() * def.pals.length)], name: def.names[Math.floor(r() * def.names.length)] };

function drawPaisaje(g, W, H, r, P, d) {
  const sky = g.createLinearGradient(0, 0, 0, H * .7);
  sky.addColorStop(0, P[1]); sky.addColorStop(.6, P[3]); sky.addColorStop(1, P[4]);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {

    g.fillStyle = c[0];
    for (const q of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { g.beginPath(); g.arc(q[0] * s / 2, q[1] * s / 2, s * .3, 0, 7); g.fill(); }
    g.fillStyle = c[1];
    for (const a of [0, Math.PI / 4]) { g.save(); g.rotate(a); g.fillRect(-s * .27, -s * .27, s * .54, s * .54); g.restore(); }
    g.fillStyle = P[0]; g.beginPath(); g.arc(0, 0, s * .2, 0, 7); g.fill();
    g.fillStyle = c[2];
    if (variant === 0) { g.beginPath(); g.arc(0, 0, s * .12, 0, 7); g.fill(); }
    else if (variant === 1) { for (let k = 0; k < 8; k++) { g.save(); g.rotate(k * Math.PI / 4); g.beginPath(); g.ellipse(0, -s * .1, s * .035, s * .08, 0, 0, 7); g.fill(); g.restore(); } }
    else { g.save(); g.rotate(Math.PI / 4); g.fillRect(-s * .09, -s * .09, s * .18, s * .18); g.restore(); }

function drawOlas(g, W, H, r, P) {

  g.fillStyle = P[4]; g.beginPath(); g.arc(W * (.2 + r() * .6), H * (.14 + r() * .08), W * .1, 0, 7); g.fill();
  const lines = 26;
  for (let i = 0; i < lines; i++) {

  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const flowers = 16 + Math.floor(r() * 10);

function drawCielo(g, W, H, r, P, d) {

  g.strokeStyle = P[3]; g.lineWidth = W / 400; g.globalAlpha = .7; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke(); g.globalAlpha = 1;

/* =================== BUENA NOTICIA =================== */
// La tarea programada de cada mañana busca una buena noticia verificada y la guarda en noticias/<fecha>.
// Si ese día no hay, se muestra la más reciente; si no hay ninguna, un avance de fondo de esta lista.
const BUENAS = [
  ["El lince ibérico ya no está «en peligro»", "Ha pasado de 94 ejemplares en 2002 a más de 2.000 en 2023. En 2024 la UICN lo rebajó a «vulnerable». Buena parte de la recuperación se ha hecho en Andalucía.", "UICN"],
  ["La mortalidad infantil se ha reducido a menos de la mitad", "Las muertes de menores de cinco años pasaron de 12,8 millones en 1990 a unos 4,9 millones en 2022.", "UNICEF"],
  ["La capa de ozono se está recuperando", "Gracias al Protocolo de Montreal, la ONU calcula que sobre la Antártida volverá a los niveles de 1980 hacia 2066.", "OMM / PNUMA"],
  ["La polio, casi erradicada", "Los casos de polio salvaje han caído más de un 99 % desde 1988.", "Iniciativa Mundial de Erradicación de la Poliomielitis"],
  ["Vivimos casi treinta años más", "La esperanza de vida mundial pasó de unos 46 años en 1950 a más de 73 hoy.", "ONU, World Population Prospects"],
  ["El quebrantahuesos volvió a Andalucía", "En 2015 nació en la sierra de Cazorla el primer pollo en libertad en Andalucía desde que la especie desapareció de allí hace décadas.", "Fundación Gypaetus"],
  ["La pobreza extrema ha caído en picado", "Del 38 % de la población mundial en 1990 a en torno al 9 % antes de la pandemia.", "Banco Mundial"],
  ["Las ballenas jorobadas se han recuperado", "Tras la prohibición de la caza comercial, la mayoría de sus poblaciones ya no se consideran en peligro.", "NOAA"],
  ["La energía limpia domina lo nuevo", "En 2023 las renovables supusieron alrededor del 86 % de la nueva capacidad eléctrica instalada en el mundo.", "IRENA"],
  ["La viruela ya no existe", "Mató a cientos de millones de personas y en 1980 se declaró erradicada gracias a la vacunación.", "OMS"],
];
let news = null;
let hojaSource = null;   // función (clave de fecha) => Promise<items | null>
async function loadHoja(d) {
  const k = keyOf(d);
  if (!hojaSource || k in HOJAS) return;
  HOJAS[k] = null;
  try { HOJAS[k] = await hojaSource(k); } catch { HOJAS[k] = null; }
  if (HOJAS[k] && keyOf(current) === k) { renderCover(!document.getElementById("sheet")); renderFeed(); }
}
function renderNews() {
  const k = keyOf(current);
  const live = news && news.date <= k ? news : null;
  const fb = BUENAS[dayNumOf(current) % BUENAS.length];
  const isToday = live && live.date === k;
  const label = live ? (isToday ? "Buena noticia de hoy" : "Buena noticia · " + live.date.split("-").reverse().slice(0, 2).join("/")) : "Buena noticia de fondo";
  const title = live ? live.titulo : fb[0], body = live ? live.resumen : fb[1], src = live ? live.fuente : fb[2];
  const box = h("section", { class: "news" },
    h("span", { class: "mono" }, label),
    h("h3", {}, title), h("p", {}, body),
    h("span", { class: "src" }, "Fuente: " + src));
  const actions = h("div", { class: "actions" });
  if (live && live.url) actions.append(h("a", { class: "btn", href: live.url, target: "_blank", rel: "noopener", html: ICON.out + "<span>Leer la noticia</span>" }));
  if (sample) actions.append(h("button", { class: "btn", type: "button", onclick: () => explain("Buena noticia", { title, prompt: `esta buena noticia: «${title}. ${body}» (fuente: ${src}). Explica el contexto y por qué importa` }), html: ICON.spark + "<span>Contexto</span>" }));
  else if (STANDALONE) actions.append(askLink(`Háblame de esta buena noticia: «${title}. ${body}» (fuente: ${src}). Explica el contexto y por qué importa.`, "Contexto"));
  if (actions.childNodes.length) box.append(actions);
  return box;
}

/* =================== CLAUDE =================== */
let aiAbort = null;
function openAiSheet(title) {
  closeAi();
  const text = h("div", { class: "ai-text wait", "aria-live": "polite" }, "Pensando…");
  const scrim = h("div", { class: "scrim", onclick: closeAi });
  const panel = h("div", { class: "sheet-ai", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("div", { class: "in" },
      h("div", { class: "mono", style: "color:var(--red)" }, "Claude explica"),
      h("h3", {}, title), text,
      h("div", {}, h("button", { class: "btn", type: "button", onclick: closeAi }, "Cerrar"))));
  scrim.id = "ai-scrim"; panel.id = "ai-panel";
  document.body.append(scrim, panel);
  return text;
}
function closeAi() {
  if (aiAbort) { aiAbort.abort(); aiAbort = null; }
  document.getElementById("ai-scrim")?.remove(); document.getElementById("ai-panel")?.remove();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAi(); });

async function runSample(title, prompt) {
  const out = openAiSheet(title);
  aiAbort = new AbortController();
  try {
    await sample(prompt, { signal: aiAbort.signal, modelTier: "default",
      onText: ({ text }) => { out.classList.remove("wait"); out.textContent = text; } });
  } catch (e) {
    if (e && e.name === "AbortError") return;
    out.classList.add("wait");
    out.textContent = e?.code === "rate_limited" ? "Demasiadas preguntas seguidas. Prueba de nuevo en un rato."
      : e?.code === "not_granted" ? "Para usar esta función, permite que la página consulte a Claude."
      : (e?.text || "No he podido obtener la explicación. Inténtalo otra vez.");
  }
}
const STYLE = "Responde en español. Explica desde los fundamentos, con un ejemplo concreto y una analogía de la vida real. Sé directo, sin relleno ni frases de cortesía. Unas 180-230 palabras, en párrafos cortos, sin títulos ni markdown. Termina con una conexión con otra disciplina (ciencia, derecho, medicina, idiomas, IA o nutrición).";
function explain(label, dsc) {
  runSample(dsc.title.length > 70 ? label : dsc.title, `Háblame de ${dsc.prompt}. ${STYLE}`);
}
function connectPrompt() {
  const pool = ["dato", "concepto", "palabra", "frase", "libro", "pelicula", "video", "refran", "cita", "cancion", "personaje", "planta"];
  const chosen = pool.sort(() => Math.random() - .5).slice(0, 3).map(c => describe(c, pick(c, current).item));
  const list = chosen.map(d => "- " + d.prompt).join("\n");
  return `Estas son tres piezas de mi dosis diaria de curiosidad:\n${list}\n\nEncuentra una conexión sorprendente pero rigurosa entre las tres, que me haga pensar. Si alguna conexión es forzada, dilo.`;
}
function connectDots() { runSample("Une los puntos", connectPrompt() + " " + STYLE); }
// Fuera de claude.ai no hay capacidad «sample»: el botón abre Claude con la pregunta ya escrita.
function askLink(prompt, label) {
  return h("a", { class: "btn", href: "https://claude.ai/new?q=" + enc(prompt + " " + STYLE), target: "_blank", rel: "noopener", html: ICON.spark + "<span>" + label + "</span>" });
}

  document.getElementById("tab-hoy").setAttribute("aria-current", view === "hoy" ? "page" : "false");

}
